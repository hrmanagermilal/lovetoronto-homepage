server {
    listen 8082 ssl;
    http2 on;
    set $senior_port 82;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 0;

    include /etc/nginx/site/senior-tls.conf;
    # Plain HTTP sent to this TLS port (nginx code 497) is redirected to HTTPS.
    error_page 497 =301 https://$host:82$request_uri;

    location = /admin {
        return 308 https://$host:83$request_uri;
    }

    location ^~ /admin/ {
        return 308 https://$host:83$request_uri;
    }

    location / {
        include /etc/nginx/site/senior-proxy.conf;
    }
}

server {
    listen 8083 ssl;
    http2 on;
    set $senior_port 83;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 0;

    include /etc/nginx/site/senior-tls.conf;
    error_page 497 =301 https://$host:83$request_uri;

    location = / {
        return 302 https://$host:83/admin$is_args$args;
    }

    location / {
        include /etc/nginx/site/senior-proxy.conf;
    }
}
