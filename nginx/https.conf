server {
    listen 8080;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        set $web_upstream homepage-web:8080;
        proxy_pass http://$web_upstream/;
    }

    location / {
        return 301 https://www.lovetoronto.org$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name lovetoronto.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/www.lovetoronto.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.lovetoronto.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    return 301 https://www.lovetoronto.org$request_uri;
}

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name www.lovetoronto.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/www.lovetoronto.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.lovetoronto.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    resolver 127.0.0.11 valid=30s ipv6=off;

    include /etc/nginx/site/api.conf;

    location / {
        set $web_upstream homepage-web:8080;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
