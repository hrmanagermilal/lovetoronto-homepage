# New managed front page: HTTPS port 84. Same site as 443, plus the hero
# slides and newsletters published from the admin site.
server {
    listen 8084 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;

    include /etc/nginx/site/senior-tls.conf;
    error_page 497 =301 https://$host:84$request_uri;

    location ^~ /api/admin/ {
        return 404;
    }

    location ^~ /api/v1/site/ {
        limit_req zone=site burst=30 nodelay;
        limit_req_status 429;
        include /etc/nginx/site/backend-proxy.conf;
        add_header Cache-Control "no-store" always;
    }

    include /etc/nginx/site/api.conf;
    include /etc/nginx/site/media.conf;

    location / {
        include /etc/nginx/site/web-proxy.conf;
    }
}
