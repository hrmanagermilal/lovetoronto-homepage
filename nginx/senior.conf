server {
    listen 8082;
    set $senior_port 82;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 0;

    location = /admin {
        return 308 http://$host:83$request_uri;
    }

    location ^~ /admin/ {
        return 308 http://$host:83$request_uri;
    }

    location / {
        include /etc/nginx/site/senior-proxy.conf;
    }
}

server {
    listen 8083;
    set $senior_port 83;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 0;

    location = / {
        return 302 http://$host:83/admin$is_args$args;
    }

    location / {
        include /etc/nginx/site/senior-proxy.conf;
    }
}
