# Homepage admin site: HTTPS port 81, Toronto-area clients only.
# Every request (pages, assets, API) is first checked by the backend geo gate.
server {
    listen 8081 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 64k;

    include /etc/nginx/site/senior-tls.conf;
    error_page 497 =301 https://$host:81$request_uri;

    # Locations that add their own headers must include this again (nginx does not merge add_header).
    include /etc/nginx/site/admin-headers.conf;

    auth_request /_area;
    error_page 403 /_area_denied.html;

    location = /_area {
        internal;
        # The body is not forwarded; the real size limit is enforced by the matching location.
        client_max_body_size 0;
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream/api/admin/gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /_area_denied.html {
        internal;
        auth_request off;
        root /etc/nginx/site/static;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'" always;
    }

    location ^~ /api/admin/auth/ {
        limit_req zone=admin_auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/site/backend-proxy.conf;
        include /etc/nginx/site/admin-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/admin/uploads/ {
        client_max_body_size 55m;
        proxy_read_timeout 120s;
        include /etc/nginx/site/backend-proxy.conf;
        include /etc/nginx/site/admin-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/admin/ {
        include /etc/nginx/site/backend-proxy.conf;
        include /etc/nginx/site/admin-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        return 404;
    }

    include /etc/nginx/site/media.conf;

    # Archived images used by the seeded hero slides (previews only).
    location ^~ /archive/ {
        include /etc/nginx/site/web-proxy.conf;
    }

    location / {
        set $admin_upstream admin-web:8080;
        proxy_pass http://$admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
    }
}
