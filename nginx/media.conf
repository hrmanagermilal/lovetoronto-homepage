# Files uploaded from the admin site (random, immutable names).
location /media/ {
    return 404;
}

location ~ "^/media/(hero|thumbs)/[0-9a-f]{32}\.(jpg|png)$" {
    root /srv;
    expires 30d;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
}

location ~ "^/media/newsletters/[0-9a-f]{32}\.pdf$" {
    root /srv;
    expires 30d;
    default_type application/pdf;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Disposition "inline" always;
}
